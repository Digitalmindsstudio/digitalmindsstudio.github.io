<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrow Trap</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;background:#0d1b2a;color:#fff;text-align:center}
  a{display:block;width:240px;margin:8px auto;padding:14px;border-radius:10px;text-decoration:none;font-weight:bold;color:#fff;background:#1f6feb}
</style>
<script>
  var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.digitalminds.arrowtrap";
  var IOS_URL     = "https://apps.apple.com/app/id6820255126";

  var ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
    location.replace(IOS_URL);
  } else if (/Android/i.test(ua)) {
    location.replace(ANDROID_URL);
  }
  window.onload = function () {
    document.getElementById("a").href = ANDROID_URL;
    document.getElementById("i").href = IOS_URL;
  };
</script>
</head>
<body>
  <h1>Arrow Trap</h1>
  <a id="a" href="#">Get it on Google Play</a>
  <a id="i" href="#">Download on the App Store</a>
</body>
</html>
